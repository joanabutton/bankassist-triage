services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.1
    ports:
      - "5001:5000"
    volumes:
      - ./mlflow-data/db:/mlflow/db
      - ./mlflow-data/artifacts:/mlflow/artifacts
      - ./docker/start-mlflow.sh:/start-mlflow.sh:ro
    user: "0:0"
    command: ["bash", "/start-mlflow.sh"]
    restart: unless-stopped
